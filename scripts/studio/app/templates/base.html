<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>{% block title %}Bang Motion Studio{% endblock %}</title>
    <link rel="stylesheet" href="/studio/static/css/app.css" />
    <script src="/studio/static/vendor/htmx.min.js" defer></script>
    <script src="/studio/static/js/studio.js" defer></script>
  </head>
  <body class="min-h-screen bg-background text-foreground antialiased" hx-boost="true" hx-headers='{"X-Studio-Request":"1"}'>
    <div class="relative min-h-screen">
      <header class="sticky top-0 z-30 border-b bg-background/95 backdrop-blur supports-[backdrop-filter]:bg-background/80">
        <div class="mx-auto flex h-14 max-w-[1440px] items-center gap-6 px-4 sm:px-6 lg:px-8">
          <a href="/studio/index.html" class="flex items-center gap-2.5 font-semibold tracking-tight" aria-label="Bang Motion Studio home">
            <span class="grid size-8 place-items-center rounded-md bg-primary text-sm font-bold text-primary-foreground">B</span>
            <span>Bang Motion <span class="font-normal text-muted-foreground">Studio</span></span>
          </a>
          <span class="hidden text-sm text-muted-foreground md:inline">Creative review workspace</span>
          <div class="ml-auto flex items-center gap-3">
            <span class="hidden items-center gap-2 rounded-full border px-2.5 py-1 text-xs text-muted-foreground sm:inline-flex"><span class="size-1.5 rounded-full bg-emerald-500"></span> Local workspace</span>
            <a href="/studio/index.html" class="btn btn-ghost btn-sm">Projects</a>
          </div>
        </div>
      </header>
      <main class="mx-auto max-w-[1440px] px-4 py-7 sm:px-6 lg:px-8 lg:py-10">
        <div id="flash-stack" class="fixed right-4 top-[4.5rem] z-50 flex w-[min(24rem,calc(100vw-2rem))] flex-col gap-2" aria-live="polite">
          {% if flash %}{% include "partials/flash.html" %}{% endif %}
        </div>
        {% block content %}{% endblock %}
      </main>
      <footer class="mx-auto max-w-[1440px] px-4 pb-8 text-xs text-muted-foreground sm:px-6 lg:px-8">Bang Motion Studio · Projects stay on this computer.</footer>
    </div>
  </body>
</html>
