<article class="scene-card" data-scene-card data-scene="{{ scene|tojson|forceescape }}">
  <div class="flex flex-wrap items-center justify-between gap-3 border-b px-4 py-3"><div class="flex items-center gap-3"><span class="grid size-7 place-items-center rounded-md bg-muted font-mono text-xs" data-scene-number>{{ loop.index }}</span><div><p class="font-medium">{{ scene.id }}</p><p class="text-xs text-muted-foreground"><span data-scene-start>{{ '%.1f'|format(scene.startSeconds) }}</span>s · <span data-scene-duration>{{ '%.1f'|format(scene.durationSeconds) }}</span>s</p></div></div><div class="flex items-center gap-1"><button type="button" class="icon-btn" data-move-scene="-1" aria-label="Move scene up" {% if loop.first %}disabled{% endif %}>↑</button><button type="button" class="icon-btn" data-move-scene="1" aria-label="Move scene down" {% if loop.last %}disabled{% endif %}>↓</button><button type="button" class="icon-btn icon-btn-danger" data-delete-scene aria-label="Delete scene" {% if content.scenes|length <= 1 %}disabled{% endif %}>×</button></div></div>
  <div class="grid gap-3 p-4 sm:grid-cols-2">
    <div class="field sm:col-span-2"><label>Visual description</label><textarea class="control min-h-20" data-scene-field="visualDescription">{{ scene.visualDescription }}</textarea></div>
    <div class="field"><label>Scene purpose</label><textarea class="control min-h-16" data-scene-field="goal">{{ scene.goal }}</textarea></div>
    <div class="field"><label>Object motion</label><textarea class="control min-h-16" data-scene-field="objectMotion">{{ scene.objectMotion }}</textarea></div>
    <div class="field"><label>Camera motion</label><textarea class="control min-h-16" data-scene-field="cameraMotion">{{ scene.cameraMotion }}</textarea></div>
    <div class="field"><label>Transition</label><textarea class="control min-h-16" data-scene-field="transition">{{ scene.transition }}</textarea></div>
    <div class="field"><label>On-screen text · one per line</label><textarea class="control min-h-16" data-scene-lines="onScreenText">{{ scene.onScreenText|join('\n') }}</textarea></div>
    <div class="field"><label>Narration</label><textarea class="control min-h-16" data-scene-field="narration">{{ scene.narration }}</textarea></div>
  </div>
</article>
